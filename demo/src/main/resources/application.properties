# App
spring.application.name=beyondmarks
server.port=8092

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/beyondmarks_db
spring.datasource.username=root
spring.datasource.password=Benny@1477
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (we'll use this in SecurityConfig)
app.jwt.secret=beyondMarksSecretKey2024VeryLongSecureKeyForJWTSigning
app.jwt.expiration=86400000

# File upload (for story photos later)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Anthropic API (optional - falls back to static guide if not set)
app.anthropic.key=YOUR_ANTHROPIC_API_KEY_HERE